chatbot:
  enabled: true
  max_history_length: 10
  max_sessions: 1000
  max_tokens: 1500
  memory_type: buffer
  session_timeout_minutes: 60
  streaming: false
  temperature: 0.1
chunking:
  chunk_overlap: 64
  chunk_size: 512
embedding:
  device: cpu
  dimension: 768
  model: BAAI/bge-base-en-v1.5
generation:
  base_url: http://localhost:11434
  max_tokens: 1000
  model: llama3.2
  temperature: 0.1
retrieval:
  final_k: 5
  initial_k: 50
  rerank_k: 10
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  use_reranker: true
sources:
  hadoop:
    base_url: https://hadoop.apache.org/docs/stable/
    max_pages: 50
    rate_limit: 5
  spark:
    base_url: https://spark.apache.org/docs/latest/
    max_pages: 100
    rate_limit: 5
vector_store:
  data_dir: data/faiss
